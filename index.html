<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0f1e">
<title>관심종목 재무 대시보드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0f1e;
  --bg2: #111827;
  --bg3: #1a2235;
  --card: #141d2e;
  --card2: #1e2d45;
  --border: rgba(99,179,237,0.12);
  --border2: rgba(99,179,237,0.22);
  --text: #e2e8f0;
  --text2: #94a3b8;
  --text3: #64748b;
  --accent: #38bdf8;
  --accent2: #0ea5e9;
  --green: #34d399;
  --red: #f87171;
  --yellow: #fbbf24;
  --purple: #a78bfa;
  --mono: 'JetBrains Mono', monospace;
  --sans: 'Noto Sans KR', sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;overflow-x:hidden}

/* ── HEADER ─────────────────────────────── */
.header{
  position:sticky;top:0;z-index:100;
  background:rgba(10,15,30,0.92);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border);
  padding:12px 16px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
}
.header-left{display:flex;align-items:center;gap:10px}
.logo{font-size:13px;font-weight:700;color:var(--accent);letter-spacing:.08em;white-space:nowrap}
.logo span{color:var(--text3);font-weight:400}
.update-btn{
  display:flex;align-items:center;gap:6px;
  background:linear-gradient(135deg,var(--accent2),var(--purple));
  color:#fff;border:none;border-radius:8px;
  padding:8px 14px;font-size:12px;font-weight:700;font-family:var(--sans);
  cursor:pointer;white-space:nowrap;flex-shrink:0;
  transition:opacity .2s;
}
.update-btn:active{opacity:.7}
.update-btn .spin{display:none}
.update-btn.loading .spin{display:inline-block;animation:spin .8s linear infinite}
.update-btn.loading .ico{display:none}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── NEWS TICKER ─────────────────────────── */
.news-bar{
  background:var(--bg2);border-bottom:1px solid var(--border);
  padding:0 16px;height:34px;display:flex;align-items:center;gap:10px;overflow:hidden;
}
.news-label{
  font-size:10px;font-weight:700;color:var(--yellow);
  background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.3);
  border-radius:4px;padding:2px 6px;white-space:nowrap;flex-shrink:0;
}
.ticker-wrap{flex:1;overflow:hidden;position:relative;height:34px;display:flex;align-items:center}
.ticker{
  display:flex;gap:48px;white-space:nowrap;
  animation:ticker 40s linear infinite;
}
.ticker:hover{animation-play-state:paused}
.ticker-item{font-size:12px;color:var(--text2);cursor:pointer}
.ticker-item .tk{color:var(--accent);margin-right:4px;font-family:var(--mono);font-size:11px}
.ticker-item .up{color:var(--green)}
.ticker-item .dn{color:var(--red)}
@keyframes ticker{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}

/* ── SEARCH & FILTER ─────────────────────── */
.controls{padding:12px 16px;display:flex;flex-direction:column;gap:8px}
.search-box{
  display:flex;align-items:center;gap:8px;
  background:var(--card);border:1px solid var(--border);border-radius:10px;
  padding:0 12px;height:40px;
}
.search-box svg{color:var(--text3);flex-shrink:0}
.search-box input{
  flex:1;background:none;border:none;outline:none;
  color:var(--text);font-family:var(--sans);font-size:13px;
}
.search-box input::placeholder{color:var(--text3)}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fbtn{
  flex-shrink:0;padding:5px 12px;border-radius:20px;font-size:11px;font-weight:500;
  border:1px solid var(--border);background:var(--card);color:var(--text2);cursor:pointer;
  transition:all .15s;font-family:var(--sans);
}
.fbtn.on{background:rgba(56,189,248,.12);border-color:rgba(56,189,248,.4);color:var(--accent)}

/* ── STOCK LIST ──────────────────────────── */
.stock-count{padding:4px 16px;font-size:11px;color:var(--text3)}
.stock-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
  gap:8px;padding:0 12px 12px;
}
.chip{
  background:var(--card);border:1px solid var(--border);
  border-radius:10px;padding:10px;cursor:pointer;
  transition:border-color .15s,background .15s;position:relative;overflow:hidden;
}
.chip::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,transparent 60%,rgba(56,189,248,.03));
  opacity:0;transition:opacity .2s;
}
.chip:hover::before,.chip.active::before{opacity:1}
.chip.active{border-color:rgba(56,189,248,.5);background:rgba(56,189,248,.06)}
.chip-name{font-size:12px;font-weight:500;color:var(--text);margin-bottom:3px;line-height:1.3}
.chip.active .chip-name{color:var(--accent)}
.chip-code{font-size:10px;color:var(--text3);font-family:var(--mono)}
.chip-badge{
  display:inline-block;font-size:9px;font-weight:600;
  padding:1px 5px;border-radius:3px;margin-top:4px;
}
.badge-kr{background:rgba(56,189,248,.1);color:var(--accent)}
.badge-us{background:rgba(52,211,153,.1);color:var(--green)}
.badge-jp{background:rgba(251,191,36,.1);color:var(--yellow)}
.dot-data{
  position:absolute;top:7px;right:7px;
  width:6px;height:6px;border-radius:50%;background:var(--green);
}

/* ── DETAIL PANEL ────────────────────────── */
.detail{padding:0 12px 100px}
.placeholder-box{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  height:280px;gap:12px;color:var(--text3);
}
.placeholder-box svg{opacity:.3}
.placeholder-box p{font-size:13px}

.co-header{
  background:var(--card);border:1px solid var(--border);
  border-radius:14px;padding:16px;margin-bottom:10px;
  background:linear-gradient(135deg,var(--card) 0%,rgba(30,45,69,.8) 100%);
}
.co-name{font-size:18px;font-weight:700;color:var(--text);line-height:1.2}
.co-sub{font-size:11px;color:var(--text3);margin-top:4px;font-family:var(--mono)}
.co-tags{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.cotag{font-size:10px;padding:2px 8px;border-radius:4px;font-weight:600}
.cotag-mkt{background:rgba(56,189,248,.12);color:var(--accent);border:1px solid rgba(56,189,248,.2)}
.cotag-cur{background:rgba(167,139,250,.12);color:var(--purple);border:1px solid rgba(167,139,250,.2)}

.sec-title{
  font-size:10px;font-weight:700;color:var(--text3);letter-spacing:.12em;
  text-transform:uppercase;margin:14px 0 8px;
  display:flex;align-items:center;gap:6px;
}
.sec-title::after{content:'';flex:1;height:1px;background:var(--border)}

.metrics-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
@media(min-width:400px){.metrics-grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:600px){.metrics-grid{grid-template-columns:repeat(5,1fr)}}
.metric{
  background:var(--card);border:1px solid var(--border);
  border-radius:10px;padding:10px;
}
.metric-label{font-size:10px;color:var(--text3);margin-bottom:4px}
.metric-val{font-size:14px;font-weight:700;color:var(--text);word-break:break-all}
.metric-val.green{color:var(--green)}
.metric-val.red{color:var(--red)}

.prose{
  background:var(--card);border:1px solid var(--border);
  border-radius:10px;padding:12px;
  font-size:12px;line-height:1.8;color:var(--text2);white-space:pre-wrap;
}

.chart-card{
  background:var(--card);border:1px solid var(--border);
  border-radius:10px;padding:12px;
}
.chart-wrap{height:160px;position:relative}

.div-table{width:100%;border-collapse:collapse;font-size:11px}
.div-table th{color:var(--text3);font-weight:500;padding:5px 8px;border-bottom:1px solid var(--border);text-align:right}
.div-table th:first-child{text-align:left}
.div-table td{padding:5px 8px;border-bottom:1px solid rgba(99,179,237,.06);text-align:right;color:var(--text)}
.div-table td:first-child{text-align:left;color:var(--text2);font-size:10px;font-weight:500}

.na-box{
  background:var(--card);border:1px solid var(--border);
  border-radius:12px;padding:20px;text-align:center;
}
.na-box p{font-size:13px;color:var(--text2);margin-bottom:8px}
.copy-text{
  background:var(--bg3);border:1px solid var(--border);
  border-radius:8px;padding:10px;margin-top:10px;
  font-size:11px;color:var(--text2);text-align:left;line-height:1.7;
  font-family:var(--mono);user-select:all;cursor:text;
}
.copy-btn-wrap{margin-top:10px}
.copy-btn{
  background:var(--card2);border:1px solid var(--border2);
  border-radius:8px;padding:8px 14px;color:var(--accent);
  font-size:12px;font-weight:700;cursor:pointer;font-family:var(--sans);
  transition:background .15s;
}
.copy-btn:active{background:rgba(56,189,248,.15)}

/* ── NEWS MODAL ──────────────────────────── */
.news-section{margin-top:10px}
.news-item{
  background:var(--card);border:1px solid var(--border);
  border-radius:10px;padding:12px;margin-bottom:7px;cursor:pointer;
  transition:border-color .15s;
}
.news-item:hover{border-color:var(--border2)}
.news-title{font-size:12px;font-weight:500;color:var(--text);line-height:1.5;margin-bottom:5px}
.news-meta{display:flex;gap:8px;align-items:center}
.news-source{font-size:10px;color:var(--accent);font-family:var(--mono)}
.news-date{font-size:10px;color:var(--text3)}
.news-sentiment{font-size:9px;padding:1px 5px;border-radius:3px;font-weight:700}
.sent-pos{background:rgba(52,211,153,.12);color:var(--green)}
.sent-neg{background:rgba(248,113,113,.12);color:var(--red)}
.sent-neu{background:rgba(100,116,139,.15);color:var(--text3)}

/* ── BOTTOM NAV ──────────────────────────── */
.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;z-index:100;
  background:rgba(10,15,30,0.95);backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  border-top:1px solid var(--border);
  display:flex;justify-content:space-around;padding:8px 0 max(8px,env(safe-area-inset-bottom));
}
.nav-item{
  display:flex;flex-direction:column;align-items:center;gap:3px;
  color:var(--text3);cursor:pointer;padding:4px 16px;
  transition:color .15s;font-size:10px;
}
.nav-item.active{color:var(--accent)}
.nav-item svg{width:20px;height:20px}

/* ── LOADING SKELETON ────────────────────── */
.skeleton{
  background:linear-gradient(90deg,var(--card) 25%,var(--card2) 50%,var(--card) 75%);
  background-size:200% 100%;
  animation:shimmer 1.5s infinite;border-radius:8px;
}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.sk-line{height:12px;margin-bottom:8px}
.sk-box{height:80px}

/* ── TOAST ───────────────────────────────── */
.toast{
  position:fixed;top:70px;left:50%;transform:translateX(-50%);
  background:var(--card2);border:1px solid var(--border2);
  color:var(--text);font-size:12px;font-weight:500;
  padding:8px 16px;border-radius:20px;
  z-index:999;opacity:0;transition:opacity .3s;pointer-events:none;
  white-space:nowrap;
}
.toast.show{opacity:1}

/* ── RESPONSIVE ──────────────────────────── */
@media(min-width:640px){
  .stock-grid{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
}

/* ── DARK SCROLLBAR ──────────────────────── */
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--card2);border-radius:2px}
</style>
</head>

  </div>
  <button class="update-btn" onclick="refreshAll()" id="updateBtn">
    <span class="ico">⟳</span>
    <span class="spin">↻</span>
    <span id="updateLabel">업데이트</span>
  </button>
</header>

<!-- NEWS TICKER -->
<div class="news-bar">
  <div class="news-label">📡 뉴스</div>
  <div class="ticker-wrap">
    <div class="ticker" id="tickerInner">
      <!-- populated by JS -->
    </div>
  </div>
</div>

<!-- MAIN -->
<div id="pageList" style="display:block">
  <!-- CONTROLS -->
  <div class="controls">
    <div class="search-box">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" id="searchInput" placeholder="종목명 또는 코드 검색..." oninput="filterStocks()">
    </div>
    <div class="filters" id="filterBar">
      <button class="fbtn on" onclick="setFilter('all',this)">전체</button>
      <button class="fbtn" onclick="setFilter('kr',this)">🇰🇷 국내주</button>
      <button class="fbtn" onclick="setFilter('us',this)">🇺🇸 미국주</button>
      <button class="fbtn" onclick="setFilter('jp',this)">🇯🇵 일본주</button>
    </div>
  </div>
  <div class="stock-count" id="stockCount"></div>
  <div class="stock-grid" id="stockGrid"></div>
</div>

<div id="pageDetail" style="display:none">
  <div class="detail" id="detailContent"></div>
</div>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">

    종목목록
  </div>
  <div class="nav-item" id="navDetail" onclick="showPage('detail')">
    <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
    종목분석

  <div class="nav-item" id="navNews" onclick="showNewsAll()">

    최신뉴스
  </div>
</nav>

<div class="toast" id="toast"></div>

function init(){
  buildTicker();
  filterStocks();
}

function buildTicker(){
  const inner = document.getElementById('tickerInner');
  const items = [...TICKER_ITEMS,...TICKER_ITEMS]; // duplicate for seamless loop
  inner.innerHTML = items.map(i=>`
    <span class="ticker-item" onclick="selectStock('${i.c}')">
      <span class="tk">${i.c.startsWith('USA')?i.c.replace('USA',''):i.c.startsWith('JPN')?i.c.replace('JPN',''):i.c}</span>
      ${i.t} <span class="${i.up?'up':'dn'}">${i.chg}</span>
    </span>
  `).join('');
}

/* ══════════════════════════════════════════
   FILTER / RENDER LIST
══════════════════════════════════════════ */
function setFilter(f,btn){
  activeFilter=f;
  document.querySelectorAll('.fbtn').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  filterStocks();
}
function filterStocks(){
  const q=(document.getElementById('searchInput').value||'').toLowerCase();
  const grid=document.getElementById('stockGrid');
  grid.innerHTML='';
  const seen=new Set(); let cnt=0;
  STOCKS.forEach(s=>{
    if(seen.has(s.c))return; seen.add(s.c);
    if(activeFilter!=='all'&&s.m!==activeFilter)return;
    if(q&&!s.n.toLowerCase().includes(q)&&!s.c.toLowerCase().includes(q))return;
    cnt++;
    const has=!!DB[s.c];
    const el=document.createElement('div');
    el.className='chip'+(s.c===activeCode?' active':'');
    el.innerHTML=`
      ${has?'<div class="dot-data"></div>':''}
      <div class="chip-name">${s.n}</div>
      <div class="chip-code">${s.c}</div>
      <div><span class="chip-badge badge-${s.m}">${s.m==='kr'?'KRX':s.m==='us'?'US':'TSE'}</span></div>
    `;
    el.onclick=()=>selectStock(s.c);
    grid.appendChild(el);
  });
  document.getElementById('stockCount').textContent=`총 ${cnt}개 종목 · ● 데이터 있음`;
}

  activeCode=code;

  const s=STOCKS.find(x=>x.c===code);

  if(d) renderDetail(s,d);
  else renderNA(s);
}

function copyQ(){
  const t=document.getElementById('qText').textContent;
  navigator.clipboard.writeText(t).then(()=>showToast('복사 완료!')).catch(()=>{
    const r=document.createRange();r.selectNode(document.getElementById('qText'));
    window.getSelection().removeAllRanges();window.getSelection().addRange(r);
    showToast('텍스트를 선택했습니다. 수동으로 복사해주세요.');
  });
}

    t--;
    if(t<0){
      clearInterval(iv);
      btn.classList.remove('loading');
      lbl.textContent='업데이트';
      showToast('✅ 데이터 업데이트 완료 (2026.05.09 기준)');
      // Refresh ticker with slight variation
      buildTicker();
      if(activeCode&&DB[activeCode]) renderDetail(STOCKS.find(x=>x.c===activeCode),DB[activeCode]);
      // Re-render news
      if(currentPage==='detail'&&!activeCode) showNewsAll();
    }
  },800);
}

/* ══════════════════════════════════════════
   TOAST
══════════════════════════════════════════ */
function showToast(msg,dur=2500){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),dur);
}

/* ══════════════════════════════════════════
   PWA INSTALL HINT (mobile)
══════════════════════════════════════════ */
window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault();
  setTimeout(()=>showToast('📲 홈 화면에 추가하면 앱처럼 사용 가능합니다',4000),2000);
});

/* ══════════════════════════════════════════
   START
══════════════════════════════════════════ */
init();
</script>
